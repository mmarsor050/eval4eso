<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación inicial / Initial assessment – Tecnología 4.º ESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EDE5; --grid:#D5DDD1; --sheet:#FFFFFF; --ink:#1F2A44; --ink2:#56617A;
  --line:#C8D0C4; --yellow:#FFC72C; --yellow-soft:#FFF3C4; --blue:#2B6CB0; --blue-soft:#DCEAF8;
  --ok:#2E7D4F; --ok-soft:#DDF0E3; --ko:#C8412B; --ko-soft:#F8E0DB; --soft:#F3F6F1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink); font-size:18px; line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  min-height:100vh;
}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 18px}
.hwrap{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.htitle{font-weight:700;font-size:17px;flex:1 1 auto}
.hwho{font-size:15px;opacity:.85}
.steps{max-width:880px;margin:8px auto 0;display:flex;gap:4px}
.steps div{flex:1;height:8px;border-radius:2px;background:#3A4766}
.steps div.done{background:var(--yellow)}
.steps div.now{background:#fff}
.stepnames{max-width:880px;margin:4px auto 0;display:flex;gap:4px;font-size:12px;color:#B9C2D6}
.stepnames span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepnames span.now{color:#fff;font-weight:700}
main{max-width:880px;margin:22px auto 60px;padding:0 14px}
.sheet{background:var(--sheet);border:2px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);padding:26px 28px}
.kicker{font-size:15px;color:var(--ink2);margin:0 0 4px}
h1{font-size:30px;line-height:1.2;margin:0 0 12px}
h2{font-size:23px;line-height:1.25;margin:0 0 14px}
h3{font-size:19px;margin:18px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--ink2)}
.q{font-size:21px;font-weight:700;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;
  background:#fff;border:2px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--ink2)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink2);flex:0 0 22px;display:grid;place-items:center}
.opt.sel{border-color:var(--ink);background:var(--yellow-soft)}
.opt.sel .dot{border-color:var(--ink)}
.opt.sel .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.opt.nls{border-style:dashed;color:var(--ink2)}
.opt:disabled{cursor:default;opacity:.8}
.opt:disabled:hover{border-color:var(--line)}
.opt.sel:disabled{border-color:var(--ink)}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:6px;padding:11px 20px;cursor:pointer;
  background:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.small{padding:6px 12px;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.warn{color:var(--ko);font-weight:700;font-size:16px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=password],select,textarea{font:inherit;color:inherit;border:2px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.row2{grid-template-columns:1fr}.sheet{padding:18px}.stepnames{display:none}}
ul.rules{margin:8px 0 16px;padding-left:22px}
ul.rules li{margin-bottom:6px}
.fig{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px;margin:0 0 16px}
.fig svg{display:block;width:100%;height:auto;max-height:300px;margin:0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.qblock{border-top:2px dashed var(--line);padding-top:16px;margin-top:18px}
.qblock:first-of-type{border-top:0;padding-top:0;margin-top:0}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numrow input{width:160px}
.unit{font-weight:700}
.tog{font:inherit;font-size:15px;border:2px dashed var(--line);background:#fff;color:var(--ink2);border-radius:6px;padding:8px 12px;cursor:pointer}
.tog.on{border-style:solid;border-color:var(--ink);background:var(--yellow-soft);color:var(--ink)}
.simctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{background:var(--blue-soft);border-left:5px solid var(--blue);padding:10px 14px;border-radius:4px;margin:0 0 16px;font-size:17px}
.locknote{background:var(--soft);border-left:5px solid var(--ink2);padding:10px 14px;border-radius:4px;margin:14px 0 0;font-size:16px}
/* símbolos */
.symgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.symcard{border:2px solid var(--line);border-radius:6px;padding:10px;background:#fff}
.symcard svg{display:block;width:100%;height:80px}
.symcard .lt{font-weight:700;margin-bottom:4px}
/* palancas */
.pool,.bin{border:2px dashed var(--line);border-radius:6px;padding:10px;min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:#fff}
.pool.target,.bin.target{border-color:var(--blue);background:var(--blue-soft)}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width:620px){.bins{grid-template-columns:1fr}}
.bin{flex-direction:column;align-items:stretch;min-height:140px;cursor:pointer}
.bin h4{margin:0 0 4px;font-size:17px}
.chip{font:inherit;font-size:16px;border:2px solid var(--ink);border-radius:20px;padding:6px 14px;background:#fff;cursor:grab;color:var(--ink)}
.chip.sel{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.pooltitle{font-size:15px;color:var(--ink2);margin:0 0 6px}
/* vistas */
.viewopts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media (max-width:620px){.viewopts{grid-template-columns:repeat(2,1fr)}}
.vopt{border:2px solid var(--line);border-radius:6px;background:#fff;padding:6px;text-align:center}
.vopt svg{width:100%;height:auto;display:block}
.vopt b{font-size:20px}
.selrow{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;margin-bottom:10px}
@media (max-width:620px){.selrow{grid-template-columns:1fr}}
/* ordenar */
.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.oitem{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;background:#fff;cursor:grab}
.oitem.drag{opacity:.4}
.oitem .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 30px}
.oitem .t{flex:1}
.oitem button{font:inherit;border:2px solid var(--line);background:#fff;border-radius:6px;width:40px;height:36px;cursor:pointer}
/* bloques de programación */
.prog{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px;display:inline-block;min-width:280px}
.blk{border-radius:6px;padding:7px 12px;color:#fff;font-weight:700;font-size:16px;margin:3px 0;width:max-content;max-width:100%}
.blk.ev{background:#C9A227;border-radius:14px 14px 6px 6px;color:#1F2A44}
.blk.ctl{background:#D9822B}
.blk.mov{background:#3D7BD6}
.blk.sen{background:#2AA1B7}
.blk.var{background:#D65A31}
.blk.look{background:#8A5CD1}
.blk .inner{margin:6px 0 2px 14px;padding-left:6px;border-left:4px solid rgba(255,255,255,.55)}
.blk .cond{display:inline-block;background:#2AA1B7;border-radius:12px;padding:2px 10px;margin:0 4px}
.blk .lbl{display:block;margin-top:4px}
.grid5{display:block;max-width:300px}
/* final */
.scoretbl{width:100%;border-collapse:collapse;margin:8px 0 18px}
.scoretbl td,.scoretbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:17px}
.bar{height:12px;background:var(--soft);border:1px solid var(--line);border-radius:3px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--blue)}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;height:96px;resize:none}
.stepsfinal{counter-reset:s;list-style:none;padding:0;margin:10px 0 18px}
.stepsfinal li{counter-increment:s;margin:0 0 10px;padding-left:40px;position:relative}
.stepsfinal li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
/* profesor */
.ttable{width:100%;border-collapse:collapse;font-size:15px}
.ttable th,.ttable td{border:1px solid var(--line);padding:5px 6px;text-align:center}
.ttable th{background:var(--soft)}
.ttable td.l{text-align:left}
.tscroll{overflow-x:auto;margin:10px 0 16px}
.lvl0{background:#F4C7BE}.lvl1{background:#FBE3B0}.lvl2{background:#DCEFC9}.lvl3{background:#B9E1C4}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;font:inherit;font-size:15px;cursor:pointer;padding:0}
.modal{position:fixed;inset:0;background:rgba(31,42,68,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .sheet{max-width:420px;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.langsw{display:inline-flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.langsw button{font:inherit;font-weight:700;font-size:14px;border:0;background:#fff;color:var(--ink);padding:5px 12px;cursor:pointer}
.langsw button.on{background:var(--yellow)}
header .langsw{border-color:#fff}
.introtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="hwrap"><div class="htitle" id="htitle"></div><div class="hwho" id="who"></div><div class="langsw" id="hlang"></div></div>
  <div class="steps" id="steps"></div>
  <div class="stepnames" id="stepnames"></div>
</header>
<main><div class="sheet" id="app"></div></main>
<div id="modal"></div>

<script>
/* =========================================================
   CONFIGURACIÓN (el profesor puede cambiar estos valores)
   ========================================================= */
const TEACHER_PASS = 'tecno4eso';          // contraseña del modo profesor
const SALT = 'hormigo-tec4-2627';          // no cambiar una vez repartida la prueba
const STORE = 'ei4eso_2627_v1';
const LANGSTORE = 'ei4eso_lang';
const GROUPS = ['4ºD','4ºV-D','4ºE'];

/* ---------- idioma ---------- */
let LANG = (() => { try{ return localStorage.getItem(LANGSTORE) || 'es'; }catch(e){ return 'es'; } })();
const bi = (es, en) => LANG === 'en' ? en : es;
function setLang(l){ LANG = l; try{ localStorage.setItem(LANGSTORE, l); }catch(e){} if(S){ S.lang = l; save(); } document.documentElement.lang = l; render(); }
function langSwitch(){ return `<button type="button" data-lang="es" class="${LANG==='es'?'on':''}" aria-pressed="${LANG==='es'}">ES</button><button type="button" data-lang="en" class="${LANG==='en'?'on':''}" aria-pressed="${LANG==='en'}">EN</button>`; }
function bindLang(root){ root.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang)); }

/* ========================================================= */
const BLOCKS = [
  {id:'T', name:'Conocimientos previos', en:'Prior knowledge', short:'Test', shortEn:'Test'},
  {id:'E', name:'Electricidad', en:'Electricity', short:'Electricidad', shortEn:'Electricity'},
  {id:'M', name:'Mecanismos', en:'Mechanisms', short:'Mecanismos', shortEn:'Mechanisms'},
  {id:'P', name:'Palancas', en:'Levers', short:'Palancas', shortEn:'Levers'},
  {id:'V', name:'Vistas', en:'Views', short:'Vistas', shortEn:'Views'},
  {id:'S', name:'Escalas', en:'Scales', short:'Escalas', shortEn:'Scales'},
  {id:'R', name:'Programación', en:'Programming', short:'Programación', shortEn:'Programming'}
];
const bName = b => bi(b.name, b.en), bShort = b => bi(b.short, b.shortEn);

const TEST = [
  {id:'T1', q:'¿Cuál es la primera fase del proceso tecnológico?', o:['Identificar el problema o la necesidad','Construir el objeto','Evaluar el resultado','Dibujar los planos'],
   qEn:'What is the first stage of the technological process?', oEn:['Identifying the problem or need','Building the object','Evaluating the result','Drawing the plans'], c:0},
  {id:'T2', q:'La propiedad de un material que le permite recuperar su forma después de deformarse se llama…', o:['Elasticidad','Plasticidad','Dureza','Fragilidad'],
   qEn:'The property of a material that lets it return to its shape after being deformed is called…', oEn:['Elasticity','Plasticity','Hardness','Brittleness'], c:0},
  {id:'T3', q:'¿Cuál de estos materiales es un buen aislante eléctrico?', o:['Plástico (PVC)','Cobre','Aluminio','Acero'],
   qEn:'Which of these materials is a good electrical insulator?', oEn:['Plastic (PVC)','Copper','Aluminium','Steel'], c:0},
  {id:'T4', q:'Cuando te sientas en una silla, las patas soportan sobre todo un esfuerzo de…', o:['Compresión','Tracción','Torsión','Cortadura'],
   qEn:'When you sit on a chair, the legs mainly withstand…', oEn:['Compression','Tension','Torsion','Shear'], c:0},
  {id:'T5', q:'¿Por qué muchas estructuras (grúas, torres eléctricas, puentes) están formadas por triángulos?', o:['Porque el triángulo no se deforma y da rigidez','Porque así la estructura pesa más','Porque queda más decorativo','Porque se gasta más material'],
   qEn:'Why are many structures (cranes, electricity pylons, bridges) made of triangles?', oEn:['Because a triangle does not deform, so it makes them rigid','Because it makes the structure heavier','Because it looks more decorative','Because it uses more material'], c:0},
  {id:'T6', q:'La intensidad de corriente eléctrica se mide en…', o:['Amperios (A)','Voltios (V)','Ohmios (Ω)','Vatios (W)'],
   qEn:'Electric current is measured in…', oEn:['Amperes (A)','Volts (V)','Ohms (Ω)','Watts (W)'], c:0},
  {id:'T7', q:'¿Cuál de estos elementos es software?', o:['El sistema operativo','El teclado','El disco duro','La placa base'],
   qEn:'Which of these is software?', oEn:['The operating system','The keyboard','The hard drive','The motherboard'], c:0},
  {id:'T8', q:'Un byte equivale a…', o:['8 bits','2 bits','10 bits','1000 bits'],
   qEn:'One byte is equal to…', oEn:['8 bits','2 bits','10 bits','1000 bits'], c:0},
  {id:'T9', q:'Antes de manipular un aparato que funciona enchufado a la red eléctrica, lo primero que hay que hacer es…', o:['Desconectarlo de la corriente','Encenderlo para comprobar que funciona','Tocar los cables para ver si tienen corriente','Mojarse las manos para sujetarlo mejor'],
   qEn:'Before handling an appliance that is plugged into the mains, the first thing to do is…', oEn:['Unplug it','Switch it on to check that it works','Touch the wires to see if they are live','Wet your hands to hold it better'], c:0},
  {id:'T10', q:'¿Cuál de estas es una fuente de energía renovable?', o:['Energía solar','Petróleo','Carbón','Gas natural'],
   qEn:'Which of these is a renewable energy source?', oEn:['Solar energy','Oil','Coal','Natural gas'], c:0}
];

const SYMNAMES = ['Pila','Bombilla (lámpara)','Interruptor','Resistencia','Motor','Timbre'];
const SYMNAMES_EN = ['Battery (cell)','Bulb (lamp)','Switch','Resistor','Motor','Buzzer'];
const LEVERS = [
  {id:'P1', name:'Tijeras', en:'Scissors', g:1},
  {id:'P2', name:'Balancín del parque', en:'Playground seesaw', g:1},
  {id:'P3', name:'Carretilla', en:'Wheelbarrow', g:2},
  {id:'P4', name:'Cascanueces', en:'Nutcracker', g:2},
  {id:'P5', name:'Pinzas de depilar', en:'Tweezers', g:3},
  {id:'P6', name:'Caña de pescar', en:'Fishing rod', g:3}
];
const STEPS_ORD = ['Desbloquear el móvil','Abrir WhatsApp','Buscar el chat de la persona','Escribir el mensaje','Pulsar el botón de enviar'];
const STEPS_ORD_EN = ['Unlock the phone','Open WhatsApp','Find the person\u2019s chat','Type the message','Press the send button'];
const ROBOT_CELLS = [{k:'2,1',x:2,y:1},{k:'2,3',x:2,y:3},{k:'0,1',x:0,y:1},{k:'3,1',x:3,y:1}];
const VIEWKEYS = ['alz','pla','per','x'];

/* ---------- catálogo de ítems (orden fijo: se usa en el código de entrega) ---------- */
const ITEMS = [];
TEST.forEach(t => ITEMS.push({id:t.id, b:'T', max:1, kind:'mc', label:t.q, labelEn:t.qEn, opts:t.o, optsEn:t.oEn, c:t.c}));
ITEMS.push({id:'E1', b:'E', max:1, kind:'mc', label:'Circuito en serie: si se funde B1, ¿qué le pasa a B2?', labelEn:'Series circuit: if B1 blows, what happens to B2?',
  opts:['B2 también se apaga','B2 sigue encendida igual','B2 brilla más'], optsEn:['B2 goes off too','B2 stays on the same','B2 gets brighter'], c:0});
ITEMS.push({id:'E2', b:'E', max:1, kind:'mc', label:'Circuito en paralelo: si se funde B1, ¿qué le pasa a B2?', labelEn:'Parallel circuit: if B1 blows, what happens to B2?',
  opts:['B2 también se apaga','B2 sigue encendida igual','B2 se funde también'], optsEn:['B2 goes off too','B2 stays on the same','B2 blows too'], c:1});
['a','b','c','d'].forEach((s,i) => ITEMS.push({id:'E3'+s, b:'E', max:.5, kind:'sym', c:i, label:'Símbolo eléctrico '+(i+1), labelEn:'Electrical symbol '+(i+1), t:'Símbolo eléctrico: '+['pila','bombilla','interruptor','resistencia'][i]}));
ITEMS.push({id:'E4', b:'E', max:1, kind:'num', c:3, unit:'A', label:'Ley de Ohm: pila de 9 V y resistencia de 3 Ω. Intensidad.', labelEn:'Ohm\u2019s law: 9 V battery and 3 Ω resistor. Current.'});
ITEMS.push({id:'E5', b:'E', max:1, kind:'num', c:6, unit:'Ω', label:'Ley de Ohm: 12 V y 2 A. Resistencia.', labelEn:'Ohm\u2019s law: 12 V and 2 A. Resistance.'});
ITEMS.push({id:'M1', b:'M', max:1, kind:'mc', label:'Engranajes: sentido de giro de la rueda conducida', labelEn:'Gears: direction of the driven gear',
  opts:['Horario (como las agujas del reloj)','Antihorario (al revés que las agujas del reloj)','No gira'], optsEn:['Clockwise','Anticlockwise','It does not turn'], c:1});
ITEMS.push({id:'M2', b:'M', max:1, kind:'mc', label:'Engranajes: velocidad de la rueda conducida', labelEn:'Gears: speed of the driven gear',
  opts:['Más rápido que la motriz','Más despacio que la motriz','A la misma velocidad'], optsEn:['Faster than the driver gear','Slower than the driver gear','At the same speed'], c:1});
ITEMS.push({id:'M3', b:'M', max:1, kind:'num', c:30, unit:'vueltas/min', unitEn:'turns/min', label:'Engranajes: vueltas por minuto de la conducida (motriz a 60)', labelEn:'Gears: turns per minute of the driven gear (driver at 60)'});
ITEMS.push({id:'M4', b:'M', max:1, kind:'mc', label:'Poleas con correa: sentido de giro de la conducida', labelEn:'Belt and pulleys: direction of the driven pulley',
  opts:['En el mismo sentido que la motriz','En sentido contrario a la motriz'], optsEn:['The same way as the driver pulley','The opposite way to the driver pulley'], c:0});
LEVERS.forEach(l => ITEMS.push({id:l.id, b:'P', max:.5, kind:'lev', c:l.g, label:'Género de palanca: '+l.name, labelEn:'Lever class: '+l.en}));
ITEMS.push({id:'P7', b:'P', max:1, kind:'mc', label:'El punto de apoyo de una palanca también se llama…', labelEn:'The pivot point of a lever is also called the…',
  opts:['Fulcro','Potencia','Resistencia','Brazo'], optsEn:['Fulcrum','Effort','Load','Arm'], c:0});
ITEMS.push({id:'V1', b:'V', max:1, kind:'view', c:'alz', label:'Vistas: elegir el alzado', labelEn:'Views: choose the front view'});
ITEMS.push({id:'V2', b:'V', max:1, kind:'view', c:'pla', label:'Vistas: elegir la planta', labelEn:'Views: choose the top view'});
ITEMS.push({id:'V3', b:'V', max:1, kind:'view', c:'per', label:'Vistas: elegir el perfil izquierdo', labelEn:'Views: choose the left side view'});
ITEMS.push({id:'S1', b:'S', max:1, kind:'num', c:4, unit:'m', label:'Escala 1:50: 8 cm en el plano. Medida real.', labelEn:'Scale 1:50: 8 cm on the plan. Real length.'});
ITEMS.push({id:'S2', b:'S', max:1, kind:'num', c:12, unit:'cm', label:'Escala 2:1: objeto de 6 cm. Medida en el dibujo.', labelEn:'Scale 2:1: 6 cm object. Length in the drawing.'});
ITEMS.push({id:'R1', b:'R', max:2, kind:'ord', label:'Ordenar los pasos de un algoritmo', labelEn:'Put the steps of an algorithm in order'});

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtNum(n){ const r = (Math.round(n*100)/100).toString(); return LANG === 'en' ? r : r.replace('.', ','); }
function fmtNumEs(n){ return (Math.round(n*100)/100).toString().replace('.', ','); }
function parseNum(s){ if(s==null) return NaN; const m = String(s).replace(/\s/g,'').match(/-?\d+(?:[.,]\d+)?/); return m ? parseFloat(m[0].replace(',','.')) : NaN; }
function fnv(s){ let h = 0x811c9dc5; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ('0000000'+h.toString(16)).slice(-8); }
function b64e(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }

function score(item, ans){
  if(ans === undefined || ans === null || ans === -1 || ans === 'nls' || ans === '') return 0;
  switch(item.kind){
    case 'mc': case 'sym': case 'lev': return ans === item.c ? item.max : 0;
    case 'view': return ans === item.c ? item.max : 0;
    case 'num': { const v = parseNum(ans); return (!isNaN(v) && Math.abs(v - item.c) < 0.011) ? item.max : 0; }
    case 'ord': { const arr = String(ans).split('').map(Number); let ok = 0; arr.forEach((v,i) => { if(v===i) ok++; }); return Math.round((ok/5)*item.max*2)/2; }
  }
  return 0;
}

  const out = {}; BLOCKS.forEach(b => out[b.id] = 0);
  ITEMS.forEach(i => out[i.b] += score(i, ans[i.id]));

}

}

function isoSVG(){
  const S0 = 38, k1 = S0*0.7071, k2 = S0*0.4082;
  const P = (x,y,z) => [(x+y)*k1, (x-y-2*z)*k2];
  const faces = [
    {f:'#FFE9A8', p:[[0,0,1],[4,0,1],[4,2,1],[0,2,1]]},
    {f:'#9CC3E6', p:[[0,0,0],[4,0,0],[4,0,1],[0,0,1]]},
    {f:'#5E90C8', p:[[4,0,0],[4,2,0],[4,2,1],[4,0,1]]},
    {f:'#9CC3E6', p:[[0,1,1],[2,1,1],[2,1,3],[0,1,3]]},
    {f:'#5E90C8', p:[[2,1,1],[2,2,1],[2,2,3],[2,1,3]]},
    {f:'#FFE9A8', p:[[0,1,3],[2,1,3],[2,2,3],[0,2,3]]}
  ];
  const all = faces.flatMap(f => f.p.map(q => P(...q)));
  const a0 = P(2,-2.6,0.5), a1 = P(2,-0.35,0.5);
  all.push(a0);
  const minx = Math.min(...all.map(p=>p[0])) - 30, maxx = Math.max(...all.map(p=>p[0])) + 20;
  const miny = Math.min(...all.map(p=>p[1])) - 20, maxy = Math.max(...all.map(p=>p[1])) + 20;
  let s = `<svg viewBox="${minx.toFixed(0)} ${miny.toFixed(0)} ${(maxx-minx).toFixed(0)} ${(maxy-miny).toFixed(0)}" xmlns="http://www.w3.org/2000/svg" role="img" style="max-height:260px">${markerDef('va')}`;
  faces.forEach(f => { s += `<polygon points="${f.p.map(q => P(...q).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${f.f}" stroke="#1F2A44" stroke-width="2.5" stroke-linejoin="round"/>`; });
  s += `<line x1="${a0[0].toFixed(1)}" y1="${a0[1].toFixed(1)}" x2="${a1[0].toFixed(1)}" y2="${a1[1].toFixed(1)}" stroke="#C8412B" stroke-width="4" marker-end="url(#va)"/>`;
  s += `<text x="${(a0[0]-14).toFixed(1)}" y="${(a0[1]+6).toFixed(1)}" font-size="20" font-weight="700" fill="#C8412B">F</text>`;
  return s + '</svg>';
}
function orthoSVG(key){
  const u = 22, W = 160, H = 110;
  const shapes = {
    alz:{w:4,h:3, poly:[[0,0],[4,0],[4,1],[2,1],[2,3],[0,3]], lines:[[[0,1],[2,1]]]},
    x:  {w:4,h:3, poly:[[0,0],[4,0],[4,3],[2,3],[2,1],[0,1]], lines:[[[2,1],[4,1]]]},
    per:{w:2,h:3, poly:[[0,0],[2,0],[2,1],[1,1],[1,3],[0,3]], lines:[]},
    pla:{w:4,h:2, poly:[[0,0],[4,0],[4,2],[0,2]], lines:[[[2,2],[2,1]],[[0,1],[2,1]]]}
  }[key];
  const ox = (W - shapes.w*u)/2, oy = (H + shapes.h*u)/2;
  const T = ([x,y]) => `${(ox + x*u).toFixed(1)},${(oy - y*u).toFixed(1)}`;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<polygon points="${shapes.poly.map(T).join(' ')}" fill="#fff" stroke="#1F2A44" stroke-width="2.5" stroke-linejoin="round"/>`;
  shapes.lines.forEach(([a,b]) => { const [ax,ay] = T(a).split(','), [bx,by] = T(b).split(','); s += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#1F2A44" stroke-width="2.5"/>`; });
  return s + '</svg>';
}

/* ---------- SVG: cuadrícula del robot ---------- */
function robotSVG(){
  const c = 50, n = 5; let s = `<svg viewBox="0 0 ${c*n+2} ${c*n+2}" xmlns="http://www.w3.org/2000/svg" class="grid5" role="img">`;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) s += `<rect x="${1+x*c}" y="${1+y*c}" width="${c}" height="${c}" fill="${(x+y)%2?'#F3F6F1':'#fff'}" stroke="#C8D0C4"/>`;
  s += `<rect x="1" y="1" width="${c*n}" height="${c*n}" fill="none" stroke="#1F2A44" stroke-width="2"/>`;
  const L = 'ABCD';
  S.shuf.robot.forEach((k,i) => { const [x,y] = k.split(',').map(Number);
    s += `<circle cx="${1+x*c+c/2}" cy="${1+y*c+c/2}" r="15" fill="#FFF3C4" stroke="#1F2A44" stroke-width="2"/><text x="${1+x*c+c/2}" y="${1+y*c+c/2+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2A44">${L[i]}</text>`; });
  const rx = 1 + c/2, ry = 1 + 4*c + c/2;
  s += `<g transform="translate(${rx} ${ry})"><rect x="-16" y="-16" width="32" height="32" rx="6" fill="#3D7BD6" stroke="#1F2A44" stroke-width="2"/><path d="M0 -11 L9 4 L-9 4 Z" fill="#fff"/></g>`;
  return s + '</svg>';
}

let selChip = null;
function bindLevers(){
  const rerender = () => { $('#pool').innerHTML = `<div style="width:100%" class="pooltitle">${bi('Objetos sin clasificar','Unsorted objects')}</div>` + levChips(0);
    $$('.bin').forEach(b => { const g = +b.dataset.bin; b.innerHTML = `<h4>${genName(g)}</h4>` + levChips(g); });
    bindChips(); };
  const place = (id, g) => { if(g === 0) delete S.ans[id]; else S.ans[id] = g; selChip = null; save(); hideWarn(); rerender(); };
  const bindChips = () => {
    $$('[data-chip]').forEach(c => {
      if(c.dataset.chip === selChip) c.classList.add('sel');
      c.onclick = e => { e.stopPropagation(); selChip = selChip === c.dataset.chip ? null : c.dataset.chip; $$('[data-chip]').forEach(x => x.classList.toggle('sel', x.dataset.chip === selChip)); };
      c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.chip); };
    });
  };
  $$('[data-bin]').forEach(b => {
    b.onclick = () => { if(selChip) place(selChip, +b.dataset.bin); };
    b.ondragover = e => { e.preventDefault(); b.classList.add('target'); };
    b.ondragleave = () => b.classList.remove('target');
    b.ondrop = e => { e.preventDefault(); b.classList.remove('target'); const id = e.dataTransfer.getData('text/plain'); if(id) place(id, +b.dataset.bin); };
  });
  bindChips();
}

      li.ondragend = () => li.classList.remove('drag');
      li.ondragover = e => e.preventDefault();
      li.ondrop = e => { e.preventDefault(); const to = +li.dataset.oi; if(dragFrom === null || dragFrom === to) return; const arr = S.ans.R1.split(''); const [m] = arr.splice(dragFrom,1); arr.splice(to,0,m); dragFrom = null; set(arr); };
    });
  };
  bind();
}

/* ---------- comprobación de pantalla completa ---------- */
function screenItems(key){
  if(key.startsWith('mc:')) return [key.slice(3)];
  return ({circuit:['E1','E2'], symbols:['E3a','E3b','E3c','E3d'], ohm:['E4','E5'], gears:['M1','M2','M3'], pulleys:['M4'],
    levers:[...LEVERS.map(l=>l.id),'P7'], views:['V1','V2','V3'], scales:['S1','S2'], order:[], robot:['R2'], logic:['R3','R4']})[key];
}
function missing(key){
  if(key === 'order') return S.ordTouched ? 0 : 1;
  return screenItems(key).filter(id => !answered(id)).length;
}

/* ---------- render principal ---------- */
function render(){
  stopAnim(); window.scrollTo(0,0);
  if(!S){ renderHeader(); return renderIntro(); }
  renderHeader();
  if(S.finished) return renderFinal();
  const key = S.screens[S.idx];
  const last = S.idx === S.screens.length - 1;
  const lbl = last ? bi('Terminar la prueba','Finish the test') : bi('Siguiente','Next');
  $('#app').innerHTML = screenHTML(key) + `<div class="nav"><span class="warn" id="warn" role="status"></span><button class="btn" id="next" data-lbl="${lbl}">${lbl}</button></div>`;
  bindScreen(key);
  $('#next').onclick = () => {
    const n = $('#next'); const miss = missing(key);
    if(miss && !n.dataset.forced){
      $('#warn').textContent = key === 'order'
        ? bi('Aún no has movido ningún paso. Si ya están en orden, pulsa otra vez.','You haven\u2019t moved any steps yet. If they are already in order, press again.')
        : (key === 'levers' ? bi('Te faltan objetos o respuestas.','Some objects or answers are missing.') : bi('Te faltan respuestas.','Some answers are missing.')) + ' ' + bi('Si no lo sabes, marca «No lo sé».','If you don\u2019t know, choose «I don\u2019t know».');
      n.dataset.forced = '1'; n.textContent = bi('Seguir igualmente','Continue anyway'); return;
    }
    if(key === 'circuit') S.locked.circuit = true;
    if(key === 'gears') S.locked.gears = true;
    if(key === 'pulleys') S.locked.pulleys = true;
    if(last){ S.finished = true; S.t1 = Date.now(); }
    else S.idx++;
    save(); render();
  };
}

/* ---------- final: código e informe ---------- */
function makeCode(st){
  const payload = {v:1, n:st.nom, a:st.ape, g:st.grp, l:st.lang||'es', t:Math.round(st.t0/60000), d:Math.round(((st.t1||Date.now())-st.t0)/1000), r:ITEMS.map(i => { const a = st.ans[i.id]; return a === undefined ? null : a; })};
  const b = b64e(JSON.stringify(payload));
  return 'EI4.' + b + '.' + fnv(b + SALT);
}
function renderFinal(){
  const bs = blockScores(S.ans); const total = Object.values(bs).reduce((a,b)=>a+b,0);
  const code = makeCode(S);
  $('#app').innerHTML = `<p class="kicker">${bi('Prueba terminada','Test finished')}</p><h1>${bi('¡Hecho','Well done')}, ${esc(S.nom)}!</h1>

  <tr><td><b>Total</b></td><td></td><td style="white-space:nowrap"><b>${fmtNum(total)}</b> / ${fmtNum(TOTALMAX)}</td></tr></tbody></table>
  <h2>${bi('Entrega en Classroom','Hand it in on Classroom')}</h2>
  <ol class="stepsfinal">
    <li>${bi('Pulsa <b>Copiar código</b> y pégalo en la tarea de Classroom (en el comentario privado o en la respuesta).','Press <b>Copy code</b> and paste it in the Classroom assignment (in a private comment or in your answer).')}</li>
    <li>${bi('Pulsa <b>Descargar mi informe</b> y adjunta el archivo a la misma tarea.','Press <b>Download my report</b> and attach the file to the same assignment.')}</li>
    <li>${bi('Marca la tarea como entregada.','Mark the assignment as handed in.')}</li>
  </ol>
  <label class="f" for="code">${bi('Tu código de entrega','Your hand-in code')}</label>
  <textarea id="code" class="codebox" readonly>${code}</textarea>
  <div class="nav" style="justify-content:flex-start"><button class="btn" id="copy">${bi('Copiar código','Copy code')}</button><button class="btn blue" id="dl">${bi('Descargar mi informe','Download my report')}</button><span class="warn" id="warn" style="color:var(--ok)"></span></div>
  <div class="nav" style="margin-top:34px"><button class="link" id="prof">${bi('Acceso del profesor','Teacher access')}</button></div>`;
  $('#copy').onclick = () => {
    const ta = $('#code'); const ok = () => $('#warn').textContent = bi('Código copiado.','Code copied.');
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(code).then(ok).catch(() => { ta.select(); document.execCommand('copy'); ok(); }); }
    else { ta.select(); document.execCommand('copy'); ok(); }
  };
  $('#dl').onclick = () => downloadReport(code);
  $('#prof').onclick = askPass;
}
/* R2 guarda el índice fijo de la casilla en ROBOT_CELLS; la letra depende del alumno */
function robotLabels(){ return ROBOT_CELLS.map(c => bi('Casilla','Square') + ' ' + 'ABCD'[S.shuf.robot.indexOf(c.k)]); }
function robotOrder(){ return [0,1,2,3].sort((a,b) => S.shuf.robot.indexOf(ROBOT_CELLS[a].k) - S.shuf.robot.indexOf(ROBOT_CELLS[b].k)); }

function answerText(it, a){
  if(a === undefined || a === null || a === '') return bi('Sin responder','No answer');
  if(a === -1 || a === 'nls') return NLS();
  switch(it.kind){
    case 'mc': return it.id === 'R2' ? robotLabels()[a] : iOpts(it)[a];
    case 'sym': return bi(SYMNAMES, SYMNAMES_EN)[a];
    case 'num': return a + (iUnit(it) ? ' ' + iUnit(it) : '');
    case 'lev': return genName(a);
    case 'view': return bi('Dibujo','Drawing') + ' ' + 'ABCD'[S.shuf.views.indexOf(a)];
    case 'ord': return String(a).split('').map(v => bi(STEPS_ORD, STEPS_ORD_EN)[+v]).join(' → ');
  }
  return String(a);
}
function downloadReport(code){
  const bs = blockScores(S.ans); const total = Object.values(bs).reduce((a,b)=>a+b,0);
  const fecha = new Date(S.t0).toLocaleString(bi('es-ES','en-GB'));
  const R = {ok:bi('Correcta','Correct'), part:bi('Parcial','Partly correct'), ko:bi('Incorrecta','Incorrect'), nr:bi('Sin responder','No answer')};
  const rows = ITEMS.map(it => {
    const a = S.ans[it.id];
    const p = score(it, a);
    const res = (a === undefined || a === null || a === '') ? R.nr : (a === -1 || a === 'nls') ? NLS() : p >= it.max ? R.ok : p > 0 ? R.part : R.ko;
    const col = res === R.ok ? '#DDF0E3' : res === R.part ? '#FFF3C4' : res === R.ko ? '#F8E0DB' : '#F3F6F1';
    return `<tr><td>${bName(BLOCKS.find(b=>b.id===it.b))}</td><td>${esc(iLabel(it))}</td><td>${esc(answerText(it, a))}</td><td style="background:${col}">${res}</td><td>${fmtNum(p)} / ${fmtNum(it.max)}</td></tr>`;
  }).join('');
  const html = `<!DOCTYPE html><html lang="${LANG}"><head><meta charset="utf-8"><title>${bi('Informe evaluación inicial','Initial assessment report')} – ${esc(S.nom)} ${esc(S.ape)}</title>
  <style>body{font-family:Arial,sans-serif;color:#1F2A44;max-width:900px;margin:24px auto;padding:0 16px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #C8D0C4;padding:6px;text-align:left;vertical-align:top}th{background:#F3F6F1}code{word-break:break-all;display:block;background:#F3F6F1;padding:8px;font-size:12px}</style></head><body>
  <h1>${bi('Evaluación inicial – Tecnología 4.º ESO','Initial assessment – Technology 4.º ESO')}</h1>
  <p><b>${bi('Alumno/a','Student')}:</b> ${esc(S.nom)} ${esc(S.ape)}<br><b>${bi('Grupo','Group')}:</b> ${esc(S.grp)}<br><b>${bi('Fecha','Date')}:</b> ${fecha}<br><b>${bi('Tiempo empleado','Time taken')}:</b> ${Math.round((S.t1-S.t0)/60000)} min<br><b>${bi('Idioma','Language')}:</b> ${LANG==='en'?'English':'Español'}</p>
  <h2>${bi('Resumen','Summary')}</h2><table><tr><th>${bi('Parte','Part')}</th><th>${bi('Puntos','Points')}</th></tr>${BLOCKS.map(b=>`<tr><td>${bName(b)}</td><td>${fmtNum(bs[b.id])} / ${fmtNum(b.max)}</td></tr>`).join('')}<tr><th>Total</th><th>${fmtNum(total)} / ${fmtNum(TOTALMAX)}</th></tr></table>
  <h2>${bi('Detalle de respuestas','Answer details')}</h2><table><tr><th>${bi('Parte','Part')}</th><th>${bi('Pregunta','Question')}</th><th>${bi('Tu respuesta','Your answer')}</th><th>${bi('Resultado','Result')}</th><th>${bi('Puntos','Points')}</th></tr>${rows}</table>
  <h2>${bi('Código de entrega','Hand-in code')}</h2><code>${code}</code></body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const clean = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_');
  a.download = `EvalInicial_${clean(S.grp)}_${clean(S.ape)}_${clean(S.nom)}.html`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  $('#warn').textContent = bi('Informe descargado. Adjúntalo en Classroom.','Report downloaded. Attach it on Classroom.');
}

/* ---------- modo profesor (siempre en español) ---------- */
function askPass(){
  $('#modal').innerHTML = `<div class="modal"><div class="sheet"><h2>${bi('Acceso del profesor','Teacher access')}</h2><label class="f" for="pw">${bi('Contraseña','Password')}</label><input type="password" id="pw">
  <div class="nav"><button class="btn sec" id="pwc">${bi('Cancelar','Cancel')}</button><span class="warn" id="pww"></span><button class="btn" id="pwo">${bi('Entrar','Enter')}</button></div></div></div>`;
  const go = () => { if($('#pw').value === TEACHER_PASS){ $('#modal').innerHTML = ''; renderTeacher(); } else $('#pww').textContent = bi('Contraseña incorrecta.','Wrong password.'); };
  $('#pwo').onclick = go; $('#pw').onkeydown = e => { if(e.key === 'Enter') go(); }; $('#pwc').onclick = () => $('#modal').innerHTML = ''; $('#pw').focus();
}
let TDATA = [];
let TEACHER = false;
function decodeCode(raw){
  const m = raw.match(/^EI4\.([A-Za-z0-9_-]+)\.([0-9a-f]{8})$/); if(!m) return {ok:false, why:'formato'};
  if(fnv(m[1] + SALT) !== m[2]) return {ok:false, why:'código alterado o incompleto'};
  try{ const p = JSON.parse(b64d(m[1])); return {ok:true, p}; }catch(e){ return {ok:false, why:'no se puede leer'}; }
}
function renderTeacher(){
  stopAnim(); $('#hdr').hidden = true;
  $('#app').innerHTML = `<p class="kicker">Modo profesor</p><h1>Resultados de la evaluación inicial</h1>
  <p>Pega todos los códigos de los alumnos (da igual si hay texto alrededor o varios por línea) y pulsa <b>Procesar</b>. Si un alumno entregó dos veces, se usa su último envío. Los códigos en inglés y en español se leen igual.</p>
  <textarea id="codes" style="height:150px;font-family:ui-monospace,Consolas,monospace;font-size:13px" placeholder="EI4.xxxx.xxxxxxxx"></textarea>
  <div class="nav" style="justify-content:flex-start"><button class="btn" id="proc">Procesar códigos</button>
  <label style="display:flex;align-items:center;gap:8px">Grupo <select id="fgrp" style="width:auto"><option value="">Todos</option>${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></label>
  <button class="btn blue" id="csv" disabled>Descargar CSV</button></div>
  <div id="tout"></div>
  <h3 style="margin-top:30px">Este equipo</h3>
  <p class="muted" style="font-size:16px">${S ? `Hay una prueba ${S.finished?'terminada':'en curso'} de ${esc(S.nom)} ${esc(S.ape)} (${esc(S.grp)}).` : 'No hay ninguna prueba guardada en este equipo.'} Reiniciar borra la prueba de este navegador para que otro alumno pueda hacerla.</p>
  <div class="nav" style="justify-content:flex-start"><button class="btn sec" id="reset" ${S?'':'disabled'}>Reiniciar este equipo</button><button class="btn sec" id="back">Salir del modo profesor</button></div>`;
  $('#proc').onclick = process; $('#fgrp').onchange = drawTeacher;
  $('#csv').onclick = downloadCSV;
  $('#back').onclick = () => render();
  $('#reset').onclick = () => { if(confirm('¿Borrar la prueba guardada en este equipo? No se puede deshacer.')){ try{ localStorage.removeItem(STORE); }catch(e){} S = null; renderTeacher(); } };
}
function process(){
  const txt = $('#codes').value; const found = txt.match(/EI4\.[A-Za-z0-9_-]+\.[0-9a-f]{8}/g) || [];
  const bad = []; const map = new Map();
  found.forEach(c => { const r = decodeCode(c); if(!r.ok){ bad.push(c.slice(0,24)+'… ('+r.why+')'); return; }
    const p = r.p; const ans = {}; ITEMS.forEach((it,i) => { if(p.r[i] !== null && p.r[i] !== undefined) ans[it.id] = p.r[i]; });
    const key = (p.a+'|'+p.n+'|'+p.g).toLowerCase();
    const rec = {nom:p.n, ape:p.a, grp:p.g, lang:p.l||'es', t:p.t*60000, d:p.d, ans};
    const prev = map.get(key); if(!prev || prev.t <= rec.t) map.set(key, rec); });
  TDATA = Array.from(map.values()).sort((a,b) => (a.grp+a.ape).localeCompare(b.grp+b.ape, 'es'));
  TDATA.bad = bad; TDATA.found = found.length;
  $('#csv').disabled = !TDATA.length; drawTeacher();
}
function lvl(p){ return p < .25 ? 0 : p < .5 ? 1 : p < .75 ? 2 : 3; }
function drawTeacher(){
  const g = $('#fgrp').value; const data = TDATA.filter(r => !g || r.grp === g);
  let h = `<p style="margin-top:14px"><b>${TDATA.length}</b> alumnos leídos de ${TDATA.found||0} códigos encontrados.${TDATA.bad && TDATA.bad.length ? ` <span class="warn">${TDATA.bad.length} código(s) no válidos:</span><br><span style="font-size:14px">${TDATA.bad.map(esc).join('<br>')}</span>` : ''}</p>`;
  if(!data.length){ $('#tout').innerHTML = h; return; }
  h += `<div class="tscroll"><table class="ttable"><thead><tr><th>Alumno/a</th><th>Grupo</th><th>Idioma</th><th>Fecha</th><th>Min</th>${BLOCKS.map(b=>`<th title="${b.name}">${b.short}<br><small>/${fmtNumEs(b.max)}</small></th>`).join('')}<th>Total<br><small>/${TOTALMAX}</small></th><th>Nota<br><small>/10</small></th></tr></thead><tbody>`;
  data.forEach(r => { const bs = blockScores(r.ans); const tot = Object.values(bs).reduce((a,b)=>a+b,0);
    h += `<tr><td class="l">${esc(r.ape)}, ${esc(r.nom)}</td><td>${esc(r.grp)}</td><td>${r.lang.toUpperCase()}</td><td>${new Date(r.t).toLocaleDateString('es-ES')}</td><td>${Math.round(r.d/60)}</td>${BLOCKS.map(b=>`<td class="lvl${lvl(bs[b.id]/b.max)}">${fmtNumEs(bs[b.id])}</td>`).join('')}<td class="lvl${lvl(tot/TOTALMAX)}"><b>${fmtNumEs(tot)}</b></td><td>${fmtNumEs(Math.round(tot/TOTALMAX*100)/10)}</td></tr>`; });
  const avg = BLOCKS.map(b => data.reduce((a,r)=>a+blockScores(r.ans)[b.id],0)/data.length);
  const avgT = avg.reduce((a,b)=>a+b,0);
  h += `<tr><th class="l" colspan="5">Media (${data.length})</th>${avg.map((v,i)=>`<th class="lvl${lvl(v/BLOCKS[i].max)}">${fmtNumEs(Math.round(v*10)/10)}</th>`).join('')}<th>${fmtNumEs(Math.round(avgT*10)/10)}</th><th>${fmtNumEs(Math.round(avgT/TOTALMAX*100)/10)}</th></tr></tbody></table></div>`;
  h += `<p style="font-size:15px">Colores: <span class="lvl0" style="padding:2px 6px">No iniciado (&lt;25 %)</span> <span class="lvl1" style="padding:2px 6px">Básico (25-49 %)</span> <span class="lvl2" style="padding:2px 6px">Medio (50-74 %)</span> <span class="lvl3" style="padding:2px 6px">Avanzado (≥75 %)</span></p>`;
  h += `<h3>Análisis por pregunta</h3><p class="muted" style="font-size:15px">Porcentaje de acierto del grupo seleccionado y porcentaje de «No lo sé». Las preguntas en rojo son las que conviene repasar.</p><div class="tscroll"><table class="ttable"><thead><tr><th>Parte</th><th>Pregunta</th><th>% acierto</th><th>% «No lo sé»</th><th>% sin responder</th></tr></thead><tbody>`;
  ITEMS.forEach(it => {
    const pts = data.reduce((a,r)=>a+score(it, r.ans[it.id]),0)/(data.length*it.max);
    const nls = data.filter(r => r.ans[it.id] === -1 || r.ans[it.id] === 'nls').length/data.length;
    const nr = data.filter(r => r.ans[it.id] === undefined || r.ans[it.id] === '').length/data.length;
    h += `<tr><td>${BLOCKS.find(b=>b.id===it.b).short}</td><td class="l">${esc(it.t||it.label)}</td><td class="lvl${lvl(pts)}">${Math.round(pts*100)} %</td><td>${Math.round(nls*100)} %</td><td>${Math.round(nr*100)} %</td></tr>`; });
  h += '</tbody></table></div>';
  $('#tout').innerHTML = h;
}
function downloadCSV(){
  const g = $('#fgrp').value; const data = TDATA.filter(r => !g || r.grp === g);
  const q = s => '"' + String(s).replace(/"/g,'""') + '"';
  const lines = [['Apellidos','Nombre','Grupo','Fecha',...BLOCKS.map(b=>b.name)].map(q).join(';')];
  data.forEach(r => { const bs = blockScores(r.ans); lines.push([q(r.ape), q(r.nom), q(r.grp), q(new Date(r.t).toLocaleDateString('es-ES')), ...BLOCKS.map(b => fmtNumEs(bs[b.id]))].join(';')); });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'evaluacion_inicial_' + (g ? g.replace(/[^A-Za-z0-9]/g,'') : 'todos') + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- arranque ---------- */
S = load();
if(S && S.lang) LANG = S.lang;
document.documentElement.lang = LANG;
render();
</script>
